services:
  distillr:
    build: .
    volumes:
      - ./library:/app/library
      - ./.env:/app/.env:ro
    ports:
      - "8765:8765"
    environment:
      - DISTILL_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ollama_data:/root/.ollama
    # Bind to loopback only. Ollama's HTTP API has no authentication, so
    # publishing it on 0.0.0.0 exposes unauthenticated inference + model
    # management to anything that can reach the Docker host. The distillr
    # service already reaches Ollama over the internal compose network via
    # OLLAMA_BASE_URL=http://ollama:11434, so host publication is only useful
    # for ``curl localhost`` debugging from the host machine itself.
    ports:
      - "127.0.0.1:11434:11434"

volumes:
  ollama_data:
