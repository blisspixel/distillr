# Run `pre-commit install --install-hooks` once after cloning, then
# `pre-commit install --hook-type pre-push` to enable the test lane.
# Hooks then run automatically on every `git commit` (and `git push`).
#
# To run manually against the whole tree: `pre-commit run --all-files`
# To skip hooks for a single commit: `git commit --no-verify`
#
# Design: the lint/type/security/test hooks run through `uv run --frozen`, so
# the covered gates use the exact tool versions pinned in uv.lock. CI also runs
# dependency, generated-contract, build, Python-matrix, and OS-matrix checks;
# pre-commit is a fast local subset, not proof of a clean CI run. uv must be
# installed.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock is current
        entry: uv lock --check
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix --force-exclude --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: bandit
        name: bandit (security)
        entry: uv run --frozen bandit -r distill/ -c pyproject.toml --severity-level medium
        language: system
        pass_filenames: false
        always_run: true

      - id: lint-imports
        name: import-linter (layer contracts)
        entry: uv run --frozen lint-imports
        language: system
        pass_filenames: false
        always_run: true

      - id: pyright
        name: pyright (full package, blocking)
        entry: uv run --frozen pyright --warnings distill/
        language: system
        pass_filenames: false
        always_run: true

      - id: agent-skill-distributions
        name: Agent Skill distributions (generated and current)
        entry: uv run --frozen python scripts/agent_skill_distributions.py --check
        language: system
        pass_filenames: false
        always_run: true

      # Full suite is too slow for every commit; runs on push instead, matching
      # the CI test gate. Enable with: pre-commit install --hook-type pre-push
      - id: pytest
        name: pytest (full suite with branch coverage)
        entry: uv run --frozen pytest -q --cov=distill --cov-fail-under=95
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
