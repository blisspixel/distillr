[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[project]
name = "distillr"
version = "0.19.29"
description = "Source-to-intelligence platform: turn YouTube, websites, and arXiv papers into a structured, reusable corpus with per-source insights, cross-source synthesis, and Deep Research reports."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Nick Seal" }]
keywords = ["research", "intelligence", "synthesis", "arxiv", "youtube", "rag", "knowledge-base", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.12"
dependencies = [
    "yt-dlp>=2026.6.9",
    "openai>=1.0.0",
    "google-genai>=1.50.0",
    "typer>=0.9.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.14.2",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "python-docx>=1.0.0",
    "playwright>=1.52.0",
    # MCP SDK v2 is a breaking line. Keep production installs on stable v1
    # until the roadmap compatibility spike explicitly graduates v2.
    "mcp>=1.27.2,<2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "markdown>=3.5.0",
    "nh3>=0.2.0",
    "pypdf>=6.13.3",
    "requests>=2.32.0",
    "httpx>=0.28.0",
    "defusedxml>=0.7.1",
    "deal>=4.24.6",
]

# The entailment verify tier (docs/design/entailment-tier.md): a local
# ~110M-param cross-encoder (HHEM-2.1-Open) scoring prose claims against
# source receipts. Optional because transformers+torch is a heavy install;
# absent means the deterministic tier stands alone, exactly as before.
[project.optional-dependencies]
entailment = [
    "transformers>=4.44",
    "torch>=2.3",
]

[project.scripts]
distill = "distill.cli:main"
distill-mcp = "distill.mcp.server:main"

# Dev tooling lives in a PEP 735 dependency group (synced by default with
# `uv sync`). It is intentionally not a [project.optional-dependencies] extra:
# the project ships to PyPI without dragging test/lint tooling into the
# install graph of downstream consumers.
[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "ruff>=0.6.0",
    "pyright>=1.1.390",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
    "msgpack>=1.2.1",
    "pre-commit>=3.5",
    "import-linter>=2.0",
]

# uv build backend. Flat layout (the package lives at the repo root, not under
# src/), so module-root is empty and module-name is set explicitly because the
# distribution name (distillr) differs from the import package (distill). All
# files inside distill/ -- including distill/web/templates and distill/web/static
# -- are packaged into the wheel by default; verified via `uv build` + wheel
# inspection in CI.
[tool.uv.build-backend]
module-name = "distill"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live_network: tests that access public remote services (excluded by default)"]
# --strict-markers: an unregistered @pytest.mark typo is an error, not a silent
# no-op. xfail_strict: an xfail that unexpectedly passes fails the suite, so a
# fixed bug can never hide behind a stale xfail.
addopts = "-m 'not live_network' --strict-markers"
xfail_strict = true

[tool.coverage.run]
# Branch coverage (stricter than line): every conditional must exercise both
# arms. Ratcheted up-only in CI via --cov-fail-under toward the 1.0 >=95% gate.
branch = true
source = ["distill"]

[tool.mutmut]
# Phase 2 verification-depth diagnostic. This is scoped to deterministic core
# modules and runs in a non-blocking Ubuntu workflow, not the per-PR CI matrix.
# See docs/design/verification-depth.md.
source_paths = ["distill/concepts", "distill/library", "distill/pipeline"]
# Mutmut stages selected source paths in isolation. Copy the full package for
# import closure, while only_mutate keeps the diagnostic surface scoped.
also_copy = ["distill"]
only_mutate = [
    "distill/concepts/merge.py",
    "distill/concepts/normalize.py",
    "distill/concepts/recovery.py",
    "distill/library/links.py",
    "distill/library/paths.py",
    "distill/library/wikilinks.py",
    "distill/pipeline/dedup.py",
    "distill/pipeline/verify.py",
    "distill/pipeline/verify_entailment.py",
]
mutate_only_covered_lines = true
# Keep recurring mutation diagnostics on deterministic contract and example
# tests. Stateful property tests and file-emitting paths remain in the normal
# suite, where they are valuable but poor mutation-driver inputs.
pytest_add_cli_args = [
    "--deselect",
    "tests/unit/pipeline/test_verify.py::test_paper_write_runs_verify_hook",
    "--deselect",
    "tests/unit/pipeline/test_verify.py::test_paper_write_verify_off_skips_sidecar",
    "--deselect",
    "tests/unit/pipeline/test_verify.py::test_paper_write_strict_refuses_insight_but_keeps_receipt",
    "--deselect",
    "tests/unit/pipeline/test_verify.py::test_paper_write_strict_clean_insight_is_written",
    "--deselect",
    "tests/unit/pipeline/test_verify.py::test_local_ingest_strict_refuses_insight",
    "--deselect",
    "tests/unit/concepts/test_merge.py::TestMergeInvariants::test_commutative_under_source_ordering",
    "--deselect",
    "tests/unit/concepts/test_merge.py::TestMergeInvariants::test_idempotent_under_duplicate_mentions",
    "--deselect",
    "tests/unit/concepts/test_merge.py::TestMergeInvariants::test_monotonic_widening_for_new_sources",
    "--deselect",
    "tests/unit/concepts/test_merge.py::TestMergeInvariants::test_evidence_bounds_invariant",
    "--deselect",
    "tests/unit/concepts/test_merge.py::TestMergeInvariants::test_contested_iff_both_uppers_positive",
    "--deselect",
    "tests/unit/concepts/test_normalize.py::TestCanonicalize::test_idempotent",
    "--deselect",
    "tests/unit/concepts/test_normalize.py::TestGroupMentions::test_grouping_is_commutative",
    "--deselect",
    "tests/unit/pipeline/test_verify.py::test_extract_numeric_claims_fuzz_no_crash_and_well_formed",
]
pytest_add_cli_args_test_selection = [
    "tests/unit/concepts/test_contract_cases.py",
    "tests/unit/concepts/test_merge.py",
    "tests/unit/concepts/test_normalize.py",
    "tests/unit/concepts/test_recovery.py",
    "tests/unit/library/test_contract_cases.py",
    "tests/unit/library/test_wikilinks.py",
    "tests/unit/commands/test_doctor_links.py",
    "tests/unit/pipeline/test_dedup.py",
    "tests/unit/pipeline/test_verify.py",
    "tests/unit/pipeline/test_verify_entailment.py",
]
max_stack_depth = 8

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Selected rule categories:
#   E, W, F  - pycodestyle + pyflakes (style + unused / undefined)
#   I        - import sorting
#   UP       - pyupgrade (modern Python syntax)
#   B        - flake8-bugbear (common bugs)
#   SIM      - flake8-simplify (refactoring)
#   RUF      - ruff-specific rules
#   C4       - flake8-comprehensions (cleaner comprehensions)
#   PTH      - flake8-use-pathlib (prefer pathlib over os.path)
#   RET      - flake8-return (cleaner returns)
#   T20      - flake8-print (no bare print - use rich.console.print)
#   A        - flake8-builtins (avoid shadowing)
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "RUF",
    "C4", "PTH", "RET", "T20", "A", "C901",
]
ignore = [
    "E501",    # Line length handled by ruff format
    "RET504",  # Unnecessary assignment before return - subjective readability preference
    "RET505",  # Unnecessary else after return - subjective readability preference
    "SIM108",  # Use ternary - often hurts readability
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Tests often shadow builtins and print debug output; that's fine.
"tests/**/*.py" = ["A001", "A002", "T201"]

[tool.ruff.lint.flake8-bugbear]
# Typer uses Option/Argument factories in default args by design - that's how
# it identifies CLI parameters. Whitelist them from B008 globally.
extend-immutable-calls = [
    "typer.Argument",
    "typer.Option",
]

[tool.ruff.lint.isort]
known-first-party = ["distill"]

[project.urls]
Homepage = "https://github.com/blisspixel/distillr"
Repository = "https://github.com/blisspixel/distillr"
Issues = "https://github.com/blisspixel/distillr/issues"

[tool.bandit]
# Exclude test/archive directories from security scans.
exclude_dirs = ["tests", "archive", "library", "output", "tmp", ".venv", "venv"]

[tool.pyright]
# Pyright runs in "basic" mode for now - lenient enough to catch real bugs
# without blocking on pre-existing typing gaps across the large CLI module.
# Tighten to "standard" or "strict" on individual modules via pyright: strict
# comments as the codebase is incrementally typed.
include = ["distill", "tests"]
exclude = [
    "**/__pycache__",
    "**/node_modules",
    "archive",
    "library",
    "output",
    "tmp",
    "**/*.pyc",
]
reportMissingImports = "error"
reportMissingTypeStubs = "none"
reportPrivateUsage = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportGeneralTypeIssues = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalSubscript = "warning"
reportOptionalCall = "warning"
# Categories that fire heavily on third-party libraries without type stubs
# (mcp ContentUnion, yt-dlp, python-docx) and on typer-Optional CLI args.
# Kept at warning severity for clear IDE diagnostics. The blocking CI and local
# hooks pass --warnings, so any of these diagnostics still fails the gate.
reportAttributeAccessIssue = "warning"
reportArgumentType = "warning"
reportAssignmentType = "warning"
reportReturnType = "warning"
reportIndexIssue = "warning"
reportPossiblyUnboundVariable = "warning"
pythonVersion = "3.12"
pythonPlatform = "All"

[tool.importlinter]
root_packages = ["distill"]

[[tool.importlinter.contracts]]
name = "Foundational layers have no upward imports"
type = "forbidden"
source_modules = [
    "distill.library",
    "distill.prompts",
]
forbidden_modules = [
    "distill.commands",
    "distill.ingestors",
    "distill.pipeline",
    "distill.mcp",
    "distill.web",
]

[[tool.importlinter.contracts]]
name = "Ingestors do not import from commands, pipeline, or mcp"
type = "forbidden"
source_modules = ["distill.ingestors"]
forbidden_modules = [
    "distill.commands",
    "distill.pipeline",
    "distill.mcp",
]

[[tool.importlinter.contracts]]
name = "Pipeline does not import from commands or mcp"
type = "forbidden"
source_modules = ["distill.pipeline"]
forbidden_modules = [
    "distill.commands",
    "distill.mcp",
]

[[tool.importlinter.contracts]]
name = "Knowledge layers (concepts, claims) stay below commands/mcp/web/ingestors"
type = "forbidden"
source_modules = [
    "distill.concepts",
    "distill.claims",
]
forbidden_modules = [
    "distill.commands",
    "distill.mcp",
    "distill.web",
    "distill.ingestors",
]
