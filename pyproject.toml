[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distillr"
version = "0.5.0"
description = "Source-to-intelligence platform: turn YouTube, websites, and arXiv papers into a structured, reusable corpus with per-source insights, cross-source synthesis, and Deep Research reports."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nick Seal" }]
keywords = ["research", "intelligence", "synthesis", "arxiv", "youtube", "rag", "knowledge-base", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2025.1.0",
    "openai>=1.0.0",
    "google-genai>=1.50.0",
    "typer>=0.9.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "python-docx>=1.0.0",
    "playwright>=1.52.0",
    "mcp>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "markdown>=3.5.0",
    "pypdf>=4.0.0",
    "requests>=2.32.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "ruff>=0.6.0",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.5",
    "build>=1.0",
    "twine>=5.0",
    "import-linter>=2.0",
]

[project.scripts]
distill = "distill.cli:main"
distill-mcp = "distill.mcp.server:main"

[tool.setuptools]
packages = [
    "distill",
    "distill.commands",
    "distill.ingestors",
    "distill.ingestors.youtube",
    "distill.ingestors.sites",
    "distill.ingestors.papers",
    "distill.library",
    "distill.llm",
    "distill.llm.providers",
    "distill.mcp",
    "distill.mcp.tools",
    "distill.pipeline",
    "distill.pipeline.analysis",
    "distill.pipeline.synthesis",
    "distill.pipeline.report",
    "distill.prompts",
    "distill.web",
    "distill.web.routes",
]

[tool.setuptools.package-data]
"distill.web" = ["templates/**/*.html", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests that hit real YouTube (deselect with -m 'not integration')"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Selected rule categories:
#   E, W, F  — pycodestyle + pyflakes (style + unused / undefined)
#   I        — import sorting
#   UP       — pyupgrade (modern Python syntax)
#   B        — flake8-bugbear (common bugs)
#   SIM      — flake8-simplify (refactoring)
#   RUF      — ruff-specific rules
#   C4       — flake8-comprehensions (cleaner comprehensions)
#   PTH      — flake8-use-pathlib (prefer pathlib over os.path)
#   RET      — flake8-return (cleaner returns)
#   T20      — flake8-print (no bare print — use rich.console.print)
#   A        — flake8-builtins (avoid shadowing)
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "RUF",
    "C4", "PTH", "RET", "T20", "A", "C901",
]
ignore = [
    "E501",    # Line length handled by ruff format
    "RET504",  # Unnecessary assignment before return — subjective readability preference
    "RET505",  # Unnecessary else after return — subjective readability preference
    "SIM108",  # Use ternary — often hurts readability
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Tests often shadow builtins and print debug output; that's fine.
"tests/**/*.py" = ["A001", "A002", "T201"]
# scripts/setup.py is an interactive installer — print is intentional.
"scripts/setup.py" = ["T201"]

[tool.ruff.lint.flake8-bugbear]
# Typer uses Option/Argument factories in default args by design — that's how
# it identifies CLI parameters. Whitelist them from B008 globally.
extend-immutable-calls = [
    "typer.Argument",
    "typer.Option",
]

[tool.ruff.lint.isort]
known-first-party = ["distill"]

[project.urls]
Homepage = "https://github.com/blisspixel/distillr"
Repository = "https://github.com/blisspixel/distillr"
Issues = "https://github.com/blisspixel/distillr/issues"

[tool.bandit]
# Exclude test/archive directories from security scans.
exclude_dirs = ["tests", "archive", "library", "output", "tmp", ".venv", "venv"]

[tool.pyright]
# Pyright runs in "basic" mode for now — lenient enough to catch real bugs
# without blocking on pre-existing typing gaps across the large CLI module.
# Tighten to "standard" or "strict" on individual modules via pyright: strict
# comments as the codebase is incrementally typed.
include = ["distill", "tests"]
exclude = [
    "**/__pycache__",
    "**/node_modules",
    "archive",
    "library",
    "output",
    "tmp",
    "**/*.pyc",
]
reportMissingImports = "error"
reportMissingTypeStubs = "none"
reportPrivateUsage = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportGeneralTypeIssues = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalSubscript = "warning"
reportOptionalCall = "warning"
# Categories that fire heavily on third-party libraries without type stubs
# (mcp ContentUnion, yt-dlp, python-docx) and on typer-Optional CLI args.
# Kept on as warnings so they still surface in IDE/CLI without failing CI.
reportAttributeAccessIssue = "warning"
reportArgumentType = "warning"
reportAssignmentType = "warning"
reportReturnType = "warning"
reportIndexIssue = "warning"
reportPossiblyUnboundVariable = "warning"
pythonVersion = "3.10"
pythonPlatform = "All"

[tool.importlinter]
root_packages = ["distill"]

[[tool.importlinter.contracts]]
name = "Foundational layers have no upward imports"
type = "forbidden"
source_modules = [
    "distill.library",
    "distill.prompts",
]
forbidden_modules = [
    "distill.commands",
    "distill.ingestors",
    "distill.pipeline",
    "distill.mcp",
    "distill.web",
]

[[tool.importlinter.contracts]]
name = "Ingestors do not import from commands, pipeline, or mcp"
type = "forbidden"
source_modules = ["distill.ingestors"]
forbidden_modules = [
    "distill.commands",
    "distill.pipeline",
    "distill.mcp",
]

[[tool.importlinter.contracts]]
name = "Pipeline does not import from commands or mcp"
type = "forbidden"
source_modules = ["distill.pipeline"]
forbidden_modules = [
    "distill.commands",
    "distill.mcp",
]
