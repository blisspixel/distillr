# Copy to a private workspace and edit there. Never put secrets in this file.
# This host-neutral profile is guidance, not an executable billing policy.
schema_version = 1
topics = ["AI news and practical implications for people using AI"]
target_words = 1000
max_revision_rounds = 2

[author]
name = "AI enthusiast"
role = "Independent reader exploring useful developments in AI"
company = ""
audience = "Curious people who want evidence before adopting new tools"
perspective = """
Interested in what AI makes possible, with evidence before enthusiasm.
Explain what changed, what is uncertain, and what a reader can try or watch.
Treat announcements as company claims. Do not invent personal experience,
employer positions, customer stories, access, or hands-on testing.
"""
voice = "Thoughtful, approachable, specific. Connected paragraphs and descriptive headings."
rules = [
  "No emojis, em dashes, slogans, or canned conclusions.",
  "Avoid filler, forced contrasts, and inflated certainty.",
  "State a useful takeaway early. Link factual claims to evidence.",
]
style_examples = [] # Only writing you own or are authorized to use.

[workflow]
lookback_days = 7
external_paid_calls = false
require_independent_non_anthropic_rewrite = false
output_formats = ["md", "docx"]
# If true, the required rewrite must have a real authorized model route.
# If a hard budget is requested, use an enforcing adapter, not a number here.
