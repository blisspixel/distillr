name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Need full history so the ancestry check below can verify the
          # tagged commit is reachable from main. The default fetch-depth=1
          # would make ``git merge-base --is-ancestor`` always fail.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.11"
          enable-cache: true

      - name: Resolve tagged commit
        id: release_ref
        run: |
          tagged_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          echo "tagged_commit=${tagged_commit}" >> "${GITHUB_OUTPUT}"
          echo "Resolved ${GITHUB_REF} to ${tagged_commit}"

      - name: Verify tag is reachable from main
        run: |
          # Refuse to publish a tag that does not point at a commit on main.
          # Without this gate, anyone with tag-push permission could tag an
          # unreviewed commit (a branch, a fork, a side commit) with a matching
          # ``pyproject.toml`` version and reach the trusted PyPI publish step.
          git fetch --no-tags origin main
          tagged_commit="${{ steps.release_ref.outputs.tagged_commit }}"
          if ! git merge-base --is-ancestor "${tagged_commit}" origin/main; then
            echo "Tag commit ${tagged_commit} is not an ancestor of origin/main; refusing to publish."
            exit 1
          fi

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(uv version --short)
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match pyproject.toml version $pkg"
            exit 1
          fi

      - name: Verify CI succeeded for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Require the ``CI`` workflow to have completed successfully on the
          # exact tagged SHA before we proceed to publish. This stops a
          # tag-push from bypassing branch protection / required checks by
          # racing ahead of (or skipping) the regular CI pipeline.
          tagged_commit="${{ steps.release_ref.outputs.tagged_commit }}"
          status=$(gh run list \
            --workflow=ci.yml \
            --commit "${tagged_commit}" \
            --json conclusion,status \
            --limit 1 \
            --jq '.[0] | "\(.status):\(.conclusion)"')
          echo "CI status for ${tagged_commit}: ${status:-none}"
          if [ "${status}" != "completed:success" ]; then
            echo "CI has not completed successfully for ${tagged_commit}; refusing to publish."
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Verify and build Agent Skill distributions
        run: |
          uv run --frozen python scripts/agent_skill_distributions.py --check
          uv run --frozen python scripts/agent_skill_distributions.py --build --output agent-dist

      - name: Verify wheel bundles runtime assets
        run: |
          # Guard against a packaging regression silently shipping a wheel
          # without dashboard or Agent Skill runtime resources.
          whl=$(ls dist/*.whl)
          for f in \
            distill/web/templates/base.html \
            distill/web/static/style.css \
            distill/resources/agent-skills/distill-corpus/SKILL.md \
            distill/resources/agent-skills/distill-corpus.manifest.json; do
            if ! unzip -l "$whl" | grep -q "$f"; then
              echo "Wheel ${whl} is missing ${f}; refusing to publish."
              exit 1
            fi
          done
          echo "Runtime assets present in ${whl}."

      - name: Smoke installed wheel Agent Skill bundle
        run: |
          whl=$(ls dist/*.whl)
          uv venv .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python "$whl"
          .wheel-smoke/bin/python -I -c "from distill.agent_skills.bundle import load_bundled_skill; print(load_bundled_skill().version)"

      - name: Generate CycloneDX SBOM
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o sbom-requirements.txt
          uv export --frozen --only-group sbom --no-emit-project --format requirements-txt -o sbom-tool-requirements.txt
          uv venv --python 3.12 .sbom-venv
          uv venv --python 3.12 .sbom-tool-venv
          sbom_python=".sbom-venv/bin/python"
          sbom_tool=".sbom-tool-venv/bin/cyclonedx-py"
          uv pip install --python "${sbom_python}" --require-hashes -r sbom-requirements.txt
          uv pip install --python .sbom-tool-venv/bin/python --require-hashes -r sbom-tool-requirements.txt
          uv pip install --python "${sbom_python}" --no-deps dist/*.whl
          "${sbom_tool}" environment \
            --pyproject pyproject.toml \
            --mc-type application \
            --sv 1.6 \
            --output-reproducible \
            --of JSON \
            -o "distillr-${tag}.cdx.json" \
            "${sbom_python}"
          SBOM_PATH="distillr-${tag}.cdx.json" SBOM_VERSION="${tag}" "${sbom_python}" - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["SBOM_PATH"])
          bom = json.loads(path.read_text(encoding="utf-8"))
          component = bom.get("metadata", {}).get("component", {})
          root_ref = component.get("bom-ref")
          dependencies = bom.get("dependencies", [])
          dependency_by_ref = {row.get("ref"): row for row in dependencies}
          root_dependencies = dependency_by_ref.get(root_ref, {}).get("dependsOn", [])
          known_refs = {root_ref}
          known_refs.update(row.get("bom-ref") for row in bom.get("components", []))

          if bom.get("bomFormat") != "CycloneDX" or bom.get("specVersion") != "1.6":
              raise SystemExit("SBOM format or specification version is invalid")
          if component.get("name") != "distillr" or component.get("version") != os.environ["SBOM_VERSION"]:
              raise SystemExit("SBOM root component does not match the release")
          if not root_ref or not root_dependencies:
              raise SystemExit("SBOM root dependency graph is empty")
          if any(ref not in known_refs for row in dependencies for ref in [row.get("ref"), *row.get("dependsOn", [])]):
              raise SystemExit("SBOM dependency graph contains an unknown component reference")
          PY
          rm -rf .sbom-venv
          rm -rf .sbom-tool-venv
          rm -f sbom-requirements.txt sbom-tool-requirements.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

      - name: Upload Agent Skill distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agent-distributions
          path: agent-dist/

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: distillr-*.cdx.json

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/distillr
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        # Pinned to the current release/v1 commit. The matching ghcr image tag
        # exists for this commit, so the generated Docker action remains usable.
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          # PEP 740 provenance attestations, signed via the OIDC identity (no
          # stored credentials). Makes the source-to-wheel chain verifiable.
          attestations: true

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Download distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom
          path: sbom/

      - name: Download Agent Skill distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: agent-distributions
          path: agent-dist/

      - name: Create or update the GitHub Release
        # Closes the gap where tags published to PyPI but no GitHub Release was
        # cut, leaving the Releases page trailing the tags. Notes come from the
        # matching CHANGELOG section; Python, Agent Skill, and SBOM artifacts
        # are attached.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          notes_file="$(mktemp)"
          awk -v marker="## ${version} " '
            index($0, marker) == 1 { found = 1; next }
            /^## / && found { exit }
            found { print }
          ' docs/CHANGELOG.md > "$notes_file" || true
          if [ ! -s "$notes_file" ]; then
            echo "Release ${tag}. See docs/CHANGELOG.md for details." > "$notes_file"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes-file "$notes_file"
            gh release upload "$tag" dist/* agent-dist/* sbom/* --clobber
          else
            gh release create "$tag" --title "$tag" --notes-file "$notes_file" dist/* agent-dist/* sbom/*
          fi
