name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Need full history so the ancestry check below can verify the
          # tagged commit is reachable from main. The default fetch-depth=1
          # would make ``git merge-base --is-ancestor`` always fail.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.11"
          enable-cache: true

      - name: Resolve tagged commit
        id: release_ref
        run: |
          tagged_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          echo "tagged_commit=${tagged_commit}" >> "${GITHUB_OUTPUT}"
          echo "Resolved ${GITHUB_REF} to ${tagged_commit}"

      - name: Verify tag is reachable from main
        run: |
          # Refuse to publish a tag that does not point at a commit on main.
          # Without this gate, anyone with tag-push permission could tag an
          # unreviewed commit (a branch, a fork, a side commit) with a matching
          # ``pyproject.toml`` version and reach the trusted PyPI publish step.
          git fetch --no-tags origin main
          tagged_commit="${{ steps.release_ref.outputs.tagged_commit }}"
          if ! git merge-base --is-ancestor "${tagged_commit}" origin/main; then
            echo "Tag commit ${tagged_commit} is not an ancestor of origin/main; refusing to publish."
            exit 1
          fi

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(uv version --short)
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match pyproject.toml version $pkg"
            exit 1
          fi

      - name: Verify CI succeeded for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Require the ``CI`` workflow to have completed successfully on the
          # exact tagged SHA before we proceed to publish. This stops a
          # tag-push from bypassing branch protection / required checks by
          # racing ahead of (or skipping) the regular CI pipeline.
          tagged_commit="${{ steps.release_ref.outputs.tagged_commit }}"
          status=$(gh run list \
            --workflow=ci.yml \
            --commit "${tagged_commit}" \
            --json conclusion,status \
            --limit 1 \
            --jq '.[0] | "\(.status):\(.conclusion)"')
          echo "CI status for ${tagged_commit}: ${status:-none}"
          if [ "${status}" != "completed:success" ]; then
            echo "CI has not completed successfully for ${tagged_commit}; refusing to publish."
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Verify wheel bundles web assets
        run: |
          # Guard against a packaging regression silently shipping a wheel
          # without the dashboard templates/static the web UI needs.
          whl=$(ls dist/*.whl)
          for f in distill/web/templates/base.html distill/web/static/style.css; do
            if ! unzip -l "$whl" | grep -q "$f"; then
              echo "Wheel ${whl} is missing ${f}; refusing to publish."
              exit 1
            fi
          done
          echo "Web assets present in ${whl}."

      - name: Generate CycloneDX SBOM
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o sbom-requirements.txt
          uvx --from cyclonedx-bom cyclonedx-py requirements sbom-requirements.txt \
            --pyproject pyproject.toml --of JSON -o "distillr-${tag}.cdx.json"
          rm -f sbom-requirements.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: distillr-*.cdx.json

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/distillr
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          # PEP 740 provenance attestations, signed via the OIDC identity (no
          # stored credentials). Makes the source-to-wheel chain verifiable.
          attestations: true
