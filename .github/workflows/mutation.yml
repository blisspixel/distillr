name: Mutation diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

# Scoped diagnostic for the 1.0 verification-depth milestone. Mutation testing
# is intentionally manual and non-blocking until the first survivor triage is
# recorded and the cadence policy is set.
env:
  UV_VERSION: "0.11.11"
  UV_PYTHON: "3.12"
  MUTMUT_VERSION: "3.6.0"

jobs:
  concepts-merge:
    name: mutmut concepts merge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync (frozen, from uv.lock)
        run: uv sync --frozen

      - name: Prove selected tests are green
        run: uv run --frozen pytest -q tests/unit/concepts/test_merge.py

      - name: Run scoped mutation diagnostic
        continue-on-error: true
        run: uv run --with "mutmut==${MUTMUT_VERSION}" mutmut run

      - name: Show mutation results
        if: always()
        run: uv run --with "mutmut==${MUTMUT_VERSION}" mutmut results
