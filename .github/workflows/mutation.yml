name: Mutation diagnostics

on:
  workflow_dispatch:
  schedule:
    - cron: "23 10 * * 1"

permissions:
  contents: read

# Scoped diagnostic for the 1.0 verification-depth milestone. Mutation scores
# are review evidence, not required checks, so this workflow remains non-blocking.
env:
  UV_VERSION: "0.11.11"
  UV_PYTHON: "3.12"
  MUTMUT_VERSION: "3.6.0"

jobs:
  core:
    name: mutmut core
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync (frozen, from uv.lock)
        run: uv sync --frozen

      - name: Prove selected tests are green
        shell: bash
        run: |
          mapfile -t pytest_args < <(
            uv run --frozen python - <<'PY'
          import tomllib
          from pathlib import Path

          content = Path("pyproject.toml").read_text(encoding="utf-8")
          config = tomllib.loads(content)["tool"]["mutmut"]
          for item in config["pytest_add_cli_args_test_selection"]:
              print(item)
          for item in config.get("pytest_add_cli_args", []):
              print(item)
          PY
          )
          uv run --frozen pytest -q "${pytest_args[@]}"

      - name: Run scoped mutation diagnostic
        run: uv run --with "mutmut==${MUTMUT_VERSION}" mutmut run

      - name: Show mutation results
        if: always()
        run: uv run --with "mutmut==${MUTMUT_VERSION}" mutmut results || true
