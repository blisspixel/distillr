name: Performance evidence

on:
  workflow_dispatch:

permissions:
  contents: read

# Evidence runs are deliberately serialized per ref. A queued run is useful
# history, while canceling an in-progress canonical matrix destroys its receipt.
concurrency:
  group: performance-evidence-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.11.11"
  UV_PYTHON: "3.12"

jobs:
  canonical:
    name: Canonical evidence (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Run canonical corpus-scale matrix
        shell: bash
        run: |
          mkdir -p performance-evidence
          uv run --no-sync python -m benchmarks.corpus_scale \
            --scale 100 --iterations 20 --timeout-seconds 60 \
            > performance-evidence/corpus-scale-100.json
          uv run --no-sync python -m benchmarks.corpus_scale \
            --scale 500 --iterations 20 --timeout-seconds 60 \
            > performance-evidence/corpus-scale-500.json
          uv run --no-sync python -m benchmarks.corpus_scale \
            --scale 1000 --iterations 20 --timeout-seconds 120 \
            > performance-evidence/corpus-scale-1000.json
          uv run --no-sync python -m benchmarks.corpus_scale \
            --scale 10000 --iterations 20 --timeout-seconds 300 \
            > performance-evidence/corpus-scale-10000.json

      - name: Run canonical frozen workflow replay
        shell: bash
        run: |
          uv run --no-sync python -m benchmarks.workflow_replay \
            --iterations 20 --timeout-seconds 30 \
            > performance-evidence/workflow-replay.json

      - name: Validate and bundle evidence
        shell: bash
        env:
          EVIDENCE_REPOSITORY: ${{ github.repository }}
          EVIDENCE_COMMIT_SHA: ${{ github.sha }}
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          EVIDENCE_RUNNER_OS: ${{ runner.os }}
          EVIDENCE_RUNNER_ARCH: ${{ runner.arch }}
          EVIDENCE_RUNNER_NAME: ${{ runner.name }}
        run: |
          uv run --no-sync python -m benchmarks.evidence_bundle \
            --receipt-dir performance-evidence \
            --output-dir performance-evidence \
            --repository "$EVIDENCE_REPOSITORY" \
            --commit-sha "$EVIDENCE_COMMIT_SHA" \
            --workflow-run-id "$EVIDENCE_RUN_ID" \
            --workflow-run-attempt "$EVIDENCE_RUN_ATTEMPT" \
            --runner-os "$EVIDENCE_RUNNER_OS" \
            --runner-arch "$EVIDENCE_RUNNER_ARCH" \
            --runner-name "$EVIDENCE_RUNNER_NAME"

      - name: Upload canonical receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-evidence-${{ runner.os }}-${{ github.sha }}
          path: performance-evidence/
          if-no-files-found: error
          retention-days: 30
