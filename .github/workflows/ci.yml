name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pin uv for reproducibility. The lockfile guarantees identical dependency
# resolution; pinning uv guarantees the resolver/installer itself is identical
# across runs. Bumped manually when a new uv release is adopted.
env:
  UV_VERSION: "0.11.11"

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync (frozen, from uv.lock)
        run: uv sync --frozen

      - name: Run tests with branch coverage
        # Branch coverage (stricter than line). --cov-fail-under is a manually
        # ratcheted floor: measured ~84.0% across the matrix (2026-06-21, min on
        # 3.14), floor held at 83 for ~1 point of headroom against per-run
        # branch-selection jitter. Ratchet up-only toward the 1.0 target of 95;
        # raise as coverage improves on a coverage-improving PR; lowering it
        # requires explicit review. (A fixed floor beats a stored-baseline
        # "must-not-decrease" gate here, which would flake on normal
        # branch-coverage jitter.)
        run: uv run --frozen pytest -q --cov=distill --cov-report=term-missing --cov-fail-under=84

  test-os:
    name: Test (${{ matrix.os }} smoke)
    # Cross-platform enforcement: Linux gets the full 3.12-3.14 coverage-gated
    # matrix above; macOS and Windows run the unit suite on 3.12 (no coverage
    # gate -- the floor is platform-independent) plus a CLI import smoke, so
    # path handling, console rendering, and subprocess behavior are proven on
    # every OS users actually run. Development happens on Windows; CI was
    # ubuntu-only before this job.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync (frozen, from uv.lock)
        run: uv sync --frozen

      - name: Run unit suite
        run: uv run --frozen pytest -q

      - name: CLI smoke
        run: uv run --frozen distill --help

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Sync (frozen)
        run: uv sync --frozen
      - name: Ruff check
        run: uv run --frozen ruff check .
      - name: Ruff format check
        run: uv run --frozen ruff format --check .

  imports:
    name: Import contracts (import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Sync (frozen)
        run: uv sync --frozen
      - name: Enforce dependency-direction contracts
        run: uv run --frozen lint-imports

  security:
    name: Security scan (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Sync (frozen)
        run: uv sync --frozen
      - name: Bandit (fail on MEDIUM+ severity)
        run: uv run --frozen bandit -r distill/ -c pyproject.toml --severity-level medium
      - name: pip-audit (locked dependencies)
        # Audits the synced environment; skips the editable distillr install
        # itself (not the dependency tree under audit).
        run: uv run --frozen pip-audit --skip-editable

  types:
    name: Type check (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Sync (frozen)
        run: uv sync --frozen
      - name: "Pyright: distill/llm/ (blocking)"
        run: uv run --frozen pyright distill/llm/
      - name: "Pyright: full surface (advisory)"
        continue-on-error: true
        run: uv run --frozen pyright distill/

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [test, lint, imports, security]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Verify wheel bundles web assets
        # The uv build backend packages distill/web data by default; this guard
        # fails the build loudly if a future change drops the dashboard
        # templates/static instead of shipping a broken wheel.
        run: |
          whl=$(ls dist/*.whl)
          for f in distill/web/templates/base.html distill/web/static/style.css; do
            if ! unzip -l "$whl" | grep -q "$f"; then
              echo "Wheel ${whl} is missing ${f}."
              exit 1
            fi
          done
          echo "Web assets present in ${whl}."

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
