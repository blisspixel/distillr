name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Pin uv for reproducibility. The lockfile guarantees identical dependency
# resolution; pinning uv guarantees the resolver/installer itself is identical
# across runs. Bumped manually when a new uv release is adopted.
env:
  UV_VERSION: "0.13.5"

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync (frozen, from uv.lock)
        run: uv sync --frozen

      - name: Run tests with branch coverage
        # Branch measurement is enabled. --cov-fail-under enforces the combined
        # statement/branch total. The separate 1.0 branch-only target remains
        # open; see docs/design/path-to-1.0.md. Ratchet this floor upward only.
        run: uv run --frozen pytest -q --cov=distill --cov-report=term-missing --cov-fail-under=95

  test-os:
    name: Test (${{ matrix.os }} smoke)
    # Cross-platform enforcement: Linux gets the full 3.12-3.15 coverage-gated
    # matrix above; macOS and Windows run the unit suite on 3.15 (no coverage
    # gate -- the floor is platform-independent) plus a CLI import smoke, so
    # path handling, console rendering, and subprocess behavior are proven on
    # every OS users actually run. Development happens on Windows; CI was
    # ubuntu-only before this job.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      UV_PYTHON: "3.15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync (frozen, from uv.lock)
        run: uv sync --frozen

      - name: Run unit suite
        run: uv run --frozen pytest -q

      - name: CLI smoke
        run: uv run --frozen distill --help

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Verify lockfile is current
        run: uv lock --check
      - name: Sync (frozen)
        run: uv sync --frozen
      - name: Ruff check
        run: uv run --frozen ruff check .
      - name: Ruff format check
        run: uv run --frozen ruff format --check .

  imports:
    name: Import contracts (import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Sync (frozen)
        run: uv sync --frozen
      - name: Enforce dependency-direction contracts
        run: uv run --frozen lint-imports

  security:
    name: Security scan (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Sync (frozen)
        run: uv sync --frozen
      - name: Bandit (fail on MEDIUM+ severity)
        run: uv run --frozen bandit -r distill/ -c pyproject.toml --severity-level medium
      - name: pip-audit (locked dependencies)
        # Audits the synced environment; skips the editable distillr install
        # itself (not the dependency tree under audit).
        run: uv run --frozen pip-audit --skip-editable
      - name: pip-audit (optional entailment extra)
        # Default sync does not install the checker. Audit the locked extra
        # from an export so a vulnerable transformers pin cannot hide there.
        run: |
          uv export --frozen --extra entailment --no-dev --no-emit-project --output-file "${RUNNER_TEMP}/entailment-requirements.txt"
          uv run --frozen pip-audit --requirement "${RUNNER_TEMP}/entailment-requirements.txt" --disable-pip

  types:
    name: Type check (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Sync (frozen)
        run: uv sync --frozen
      - name: "Pyright: full surface (blocking)"
        run: uv run --frozen pyright --warnings distill/

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [test, lint, imports, security]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Verify and build Agent Skill distributions
        run: |
          uv run --frozen python scripts/agent_skill_distributions.py --check
          uv run --frozen python scripts/agent_skill_distributions.py --build --output agent-dist
          uv run --frozen python -m scripts.editorial_skill_distributions --check
          uv run --frozen python -m scripts.editorial_skill_distributions --build --output agent-dist

      - name: Verify wheel bundles runtime assets
        # The uv build backend packages package data by default. This guard
        # fails loudly if a future change drops dashboard or Agent Skill
        # resources instead of shipping a broken wheel.
        run: |
          whl=$(ls dist/*.whl)
          for f in \
            distill/web/templates/base.html \
            distill/web/static/app.js \
            distill/web/static/style.css \
            distill/web/static/theme-init.js \
            distill/web/static/export.css \
            distill/web/themes/house-dark.toml \
            distill/web/themes/house-light.toml \
            distill/editorial/default-perspective.toml \
            distill/resources/agent-skills/distill-corpus/SKILL.md \
            distill/resources/agent-skills/distill-corpus.manifest.json; do
            if ! unzip -l "$whl" | grep -q "$f"; then
              echo "Wheel ${whl} is missing ${f}."
              exit 1
            fi
          done
          python3 - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {wheels}")
          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_name = next(
                  name for name in archive.namelist() if name.endswith(".dist-info/METADATA")
              )
              requires = [
                  line
                  for line in archive.read(metadata_name).decode("utf-8").splitlines()
                  if line.startswith("Requires-Dist:")
              ]
          if not any(line.startswith("Requires-Dist: certifi>=") for line in requires):
              raise SystemExit("wheel metadata is missing the certifi floor")
          if not any(line.startswith("Requires-Dist: pypdf>=") for line in requires):
              raise SystemExit("wheel metadata is missing the pypdf floor")
          if not any(line.startswith("Requires-Dist: opentelemetry-api>=") for line in requires):
              raise SystemExit("wheel metadata is missing the opentelemetry-api floor")
          if not any(line.startswith("Requires-Dist: packaging>=") for line in requires):
              raise SystemExit("wheel metadata is missing the self-update version parser")
          pip_runtime = [
              line
              for line in requires
              if line == "Requires-Dist: pip"
              or line.startswith("Requires-Dist: pip>")
              or line.startswith("Requires-Dist: pip=")
              or line.startswith("Requires-Dist: pip<")
              or line.startswith("Requires-Dist: pip;")
          ]
          if pip_runtime:
              raise SystemExit(f"wheel metadata must not require pip: {pip_runtime}")
          PY
          echo "Runtime assets present in ${whl}."

      - name: Smoke installed wheel Agent Skill bundle
        run: |
          whl=$(ls dist/*.whl)
          uv venv .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python "$whl"
          .wheel-smoke/bin/python -I -c "from distill.update import latest_is_newer; assert latest_is_newer('0.20.7', '0.20.8'); assert not latest_is_newer('0.20.8', '0.20.8')"
          .wheel-smoke/bin/python -I -c "from distill.agent_skills.bundle import load_bundled_skill; print(load_bundled_skill().version)"
          .wheel-smoke/bin/python -I -c "from distill.web.theme import load_themes; themes = load_themes(); assert len(themes.themes) == 12; assert not themes.notices"
          .wheel-smoke/bin/python -I -c "from pathlib import Path; from tempfile import TemporaryDirectory; from distill.editorial.perspective import init_perspective, load_perspective; temp = TemporaryDirectory(); brief = load_perspective(init_perspective(Path(temp.name) / 'perspective.toml')); assert not brief.budget.allow_metered; temp.cleanup()"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

      - name: Upload Agent Skill distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agent-distributions
          path: agent-dist/

  container:
    name: Container (Python 3.15)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and smoke the default container
        run: |
          docker build --tag distillr:ci .
          docker run --rm distillr:ci distill --version
          docker run --rm distillr:ci python -c "from distill.web.theme import load_themes; assert len(load_themes().themes) == 12"
