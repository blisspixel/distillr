name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Pin uv for reproducibility. The lockfile guarantees identical dependency
# resolution; pinning uv guarantees the resolver/installer itself is identical
# across runs. Bumped manually when a new uv release is adopted.
env:
  UV_VERSION: "0.11.11"

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync (frozen, from uv.lock)
        run: uv sync --frozen

      - name: Run tests with branch coverage
        # Branch coverage (stricter than line). --cov-fail-under is a manually
        # ratcheted floor: measured 95.04% in the 0.19.56 full filtered run; the
        # 1.0 target reached 95. Ratchet up-only from here; raise as
        # coverage improves on a coverage-improving PR; lowering requires review.
        run: uv run --frozen pytest -q --cov=distill --cov-report=term-missing --cov-fail-under=95

  test-os:
    name: Test (${{ matrix.os }} smoke)
    # Cross-platform enforcement: Linux gets the full 3.12-3.14 coverage-gated
    # matrix above; macOS and Windows run the unit suite on 3.12 (no coverage
    # gate -- the floor is platform-independent) plus a CLI import smoke, so
    # path handling, console rendering, and subprocess behavior are proven on
    # every OS users actually run. Development happens on Windows; CI was
    # ubuntu-only before this job.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync (frozen, from uv.lock)
        run: uv sync --frozen

      - name: Run unit suite
        run: uv run --frozen pytest -q

      - name: CLI smoke
        run: uv run --frozen distill --help

  test-python-prerelease:
    name: Test (Python 3.15 prerelease, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      UV_PYTHON: "3.15"
      PRERELEASE_UV_VERSION: "0.12.6"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          # The prerelease lane needs uv's current managed-Python catalog.
          # uv 0.11.11 selects an obsolete Python 3.15 alpha on Linux.
          version: ${{ env.PRERELEASE_UV_VERSION }}
          enable-cache: true

      - name: Compile source on the current prerelease runtime
        run: uv run --no-project --python 3.15 python -m compileall -q distill

      - name: Probe prerelease dependency readiness
        id: prerelease_sync
        shell: bash
        run: |
          set +e
          uv sync --frozen > prerelease-sync.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Python 3.15 source compilation passed, but the locked dependency set is not ready."
          tail -n 40 prerelease-sync.log

      - name: Run unit suite on prerelease runtime
        if: steps.prerelease_sync.outputs.ready == 'true'
        run: uv run --frozen pytest -q

      - name: CLI smoke on prerelease runtime
        if: steps.prerelease_sync.outputs.ready == 'true'
        run: uv run --frozen distill --help

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Verify lockfile is current
        run: uv lock --check
      - name: Sync (frozen)
        run: uv sync --frozen
      - name: Ruff check
        run: uv run --frozen ruff check .
      - name: Ruff format check
        run: uv run --frozen ruff format --check .

  imports:
    name: Import contracts (import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Sync (frozen)
        run: uv sync --frozen
      - name: Enforce dependency-direction contracts
        run: uv run --frozen lint-imports

  security:
    name: Security scan (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Sync (frozen)
        run: uv sync --frozen
      - name: Bandit (fail on MEDIUM+ severity)
        run: uv run --frozen bandit -r distill/ -c pyproject.toml --severity-level medium
      - name: pip-audit (locked dependencies)
        # Audits the synced environment; skips the editable distillr install
        # itself (not the dependency tree under audit).
        run: uv run --frozen pip-audit --skip-editable

  types:
    name: Type check (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Sync (frozen)
        run: uv sync --frozen
      - name: "Pyright: full surface (blocking)"
        run: uv run --frozen pyright --warnings distill/

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [test, lint, imports, security]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Verify and build Agent Skill distributions
        run: |
          uv run --frozen python scripts/agent_skill_distributions.py --check
          uv run --frozen python scripts/agent_skill_distributions.py --build --output agent-dist

      - name: Verify wheel bundles runtime assets
        # The uv build backend packages package data by default. This guard
        # fails loudly if a future change drops dashboard or Agent Skill
        # resources instead of shipping a broken wheel.
        run: |
          whl=$(ls dist/*.whl)
          for f in \
            distill/web/templates/base.html \
            distill/web/static/app.js \
            distill/web/static/style.css \
            distill/resources/agent-skills/distill-corpus/SKILL.md \
            distill/resources/agent-skills/distill-corpus.manifest.json; do
            if ! unzip -l "$whl" | grep -q "$f"; then
              echo "Wheel ${whl} is missing ${f}."
              exit 1
            fi
          done
          echo "Runtime assets present in ${whl}."

      - name: Smoke installed wheel Agent Skill bundle
        run: |
          whl=$(ls dist/*.whl)
          uv venv .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python "$whl"
          .wheel-smoke/bin/python -I -c "from distill.agent_skills.bundle import load_bundled_skill; print(load_bundled_skill().version)"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

      - name: Upload Agent Skill distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agent-distributions
          path: agent-dist/
