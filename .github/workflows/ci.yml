name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pin uv for reproducibility. The lockfile guarantees identical dependency
# resolution; pinning uv guarantees the resolver/installer itself is identical
# across runs. Bumped via Dependabot's github-actions / uv updates.
env:
  UV_VERSION: "0.11.11"

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync (frozen, from uv.lock)
        run: uv sync --frozen

      - name: Run tests with branch coverage
        # Branch coverage (stricter than line); --cov-fail-under is the
        # ratcheted floor. 0.8.4 baseline ~80% branch, floor set just under at
        # 79 for matrix headroom; ratchet up-only toward the 1.0 target of 95.
        # Raise it as coverage improves, never lower it.
        run: uv run --frozen pytest -q --cov=distill --cov-report=term-missing --cov-fail-under=79

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Sync (frozen)
        run: uv sync --frozen
      - name: Ruff check
        run: uv run --frozen ruff check .
      - name: Ruff format check
        run: uv run --frozen ruff format --check .

  imports:
    name: Import contracts (import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Sync (frozen)
        run: uv sync --frozen
      - name: Enforce dependency-direction contracts
        run: uv run --frozen lint-imports

  security:
    name: Security scan (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Sync (frozen)
        run: uv sync --frozen
      - name: Bandit (fail on MEDIUM+ severity)
        run: uv run --frozen bandit -r distill/ -c pyproject.toml --severity-level medium
      - name: pip-audit (locked dependencies)
        # Audits the synced environment; skips the editable distillr install
        # itself (not the dependency tree under audit).
        run: uv run --frozen pip-audit --skip-editable

  types:
    name: Type check (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Sync (frozen)
        run: uv sync --frozen
      - name: "Pyright: distill/llm/ (blocking)"
        run: uv run --frozen pyright distill/llm/
      - name: "Pyright: full surface (advisory)"
        continue-on-error: true
        run: uv run --frozen pyright distill/

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [test, lint, imports, security]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Verify wheel bundles web assets
        # The uv build backend packages distill/web data by default; this guard
        # fails the build loudly if a future change drops the dashboard
        # templates/static instead of shipping a broken wheel.
        run: |
          whl=$(ls dist/*.whl)
          for f in distill/web/templates/base.html distill/web/static/style.css; do
            if ! unzip -l "$whl" | grep -q "$f"; then
              echo "Wheel ${whl} is missing ${f}."
              exit 1
            fi
          done
          echo "Web assets present in ${whl}."

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
