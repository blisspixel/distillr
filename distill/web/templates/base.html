<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Distill{% endblock %}</title>
  <meta name="htmx-config" content='{"allowEval": false, "allowScriptTags": false}'>
  <link rel="stylesheet" href="/static/style.css?v={{ asset_version }}">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js?v={{ script_version }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div class="layout">
    <aside class="sidebar">
      <div class="logo">Distill</div>
      <div class="tagline">Stay current. Learn fast. Build corpus.</div>
      <nav aria-label="Primary">
        <a href="/" class="{% if active_nav == 'dashboard' %}active{% endif %}"{% if active_nav == 'dashboard' %} aria-current="page"{% endif %}>Dashboard</a>
        <a href="/topics" class="{% if active_nav == 'topics' %}active{% endif %}"{% if active_nav == 'topics' %} aria-current="page"{% endif %}>Topics</a>
        <a href="/costs" class="{% if active_nav == 'costs' %}active{% endif %}"{% if active_nav == 'costs' %} aria-current="page"{% endif %}>Costs</a>
        <a href="/watchlist" class="{% if active_nav == 'watchlist' %}active{% endif %}"{% if active_nav == 'watchlist' %} aria-current="page"{% endif %}>Watchlist</a>
      </nav>
    </aside>
    <main class="main" id="main-content" tabindex="-1">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
