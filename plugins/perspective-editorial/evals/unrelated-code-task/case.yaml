schema_version: "1.1"
name: unrelated-code-task
description: Avoids activating editorial procedures for coding questions.
tags: [negative, trigger]
runs: 1
execution:
  prompt: >-
    Explain Python list slicing with a tiny example. Do not inspect any project files.
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: []
graders:
  - type: llm
    name: behavior
    criteria: >-
      Answers the Python question directly without introducing editorial workflows, private perspectives, research receipts, Distillr, Retonr, blog writing, or billing setup.
    focus: last_message
    weight: 1
expected_outcome: Avoids activating editorial procedures for coding questions.
