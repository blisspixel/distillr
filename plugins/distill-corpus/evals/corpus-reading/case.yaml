schema_version: "1.1"
name: corpus-reading
description: Uses the Distill corpus orientation and receipt chain before answering.
tags: [corpus, trigger, verification]
runs: 1
execution:
  prompt: >-
    I have a Distill research library with a topic called local-models. Before
    answering what the corpus says about quantization tradeoffs, explain the
    exact order you would inspect the topic and how you would support a
    load-bearing claim. Describe the workflow only; do not inspect a live
    corpus or answer the research question yet.
  max_turns: 10
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - type: llm
    name: orientation-first
    criteria: >-
      Judge the proposed inspection workflow, not whether files were actually
      opened; the user asks for an explanation. PASS if it requires topic
      AGENTS.md or CLAUDE.md orientation before synthesis artifacts, then
      per-source insights. Reading topic intent or running a read-only audit
      between those stages is valid if that relative order is preserved.
      FAIL if it skips that chain, reverses the order, or treats a synthesis
      as final ground truth. Formatting and exact wording do not matter.
    focus: last_message
    weight: 1
  - type: llm
    name: receipt-grounding
    criteria: >-
      Pass only if the response requires a load-bearing claim to be checked
      against the adjacent raw receipt and says the final answer should name
      specific corpus paths or citations. Do not require exact wording.
    focus: last_message
    weight: 1
expected_outcome: The agent follows the orientation, synthesis, insight, receipt chain.
